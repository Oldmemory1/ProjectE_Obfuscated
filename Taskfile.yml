# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  JAVA8_HOME: /usr/lib/jvm/java-8-openjdk-amd64

tasks:
  default:
    desc: Build the mod jar
    cmds:
      - task: build

  build:
    desc: Build the mod normally (no obfuscation)
    env:
      JAVA_HOME: "{{.JAVA8_HOME}}"
    cmds:
      - ./gradlew build

  clean:
    desc: Clean build artifacts
    env:
      JAVA_HOME: "{{.JAVA8_HOME}}"
    cmds:
      - ./gradlew clean

  jar:
    desc: Build only the jar (no tests)
    env:
      JAVA_HOME: "{{.JAVA8_HOME}}"
    cmds:
      - ./gradlew jar

  test:
    desc: Run tests
    env:
      JAVA_HOME: "{{.JAVA8_HOME}}"
    cmds:
      - ./gradlew test

  obfuscate:
    desc: Generate .obfuscated/ source tree (does not touch original src/)
    cmds:
      - venv/bin/python3 obfuscate.py

  clean-obf:
    desc: Remove the obfuscated source tree
    cmds:
      - rm -rf .obfuscated/

  build-obf:
    desc: Build from obfuscated source (deploy, build, restore — .obfuscated/ persists)
    env:
      JAVA_HOME: "{{.JAVA8_HOME}}"
    cmds:
      - task: obfuscate
      - |
        set -e
        echo "Backing up original src/ and build.gradle..."
        cp -a src src.bak
        cp build.gradle build.gradle.bak
        echo "Deploying obfuscated source..."
        rm -rf src
        cp -a .obfuscated src
        cp src/build.gradle build.gradle
        rm src/build.gradle
        trap 'echo "Restoring original source..."; rm -rf src; mv src.bak src; mv build.gradle.bak build.gradle; rm -rf src.bak' EXIT
        echo "Building obfuscated mod..."
        ./gradlew build
